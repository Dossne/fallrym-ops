name: itch — collect comments
on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '47 4 * * *' # a spare: GitHub skips scheduled runs now and then (6 Nov: none fired)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch comments
        run: python3 tools/itch_comments.py https://dossne.itch.io/fallrym
      - name: Commit if anything changed
        run: |
          git config user.name 'fallrym-ops' && git config user.email 'actions@users.noreply.github.com'
          date -u +'%F %H:%M UTC' > comments/last_run.txt # a heartbeat: the digest can tell «nothing new» from «the collector didn't run»
          git add comments
          git diff --cached --quiet || { git commit -m "comments: $(date -u +%F)" && git push; }
