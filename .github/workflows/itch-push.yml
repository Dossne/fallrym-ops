name: itch — push the demo
on:
  push:
    branches: [main]
    paths: ['demo/**']
  workflow_dispatch:
concurrency: itch-push
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get butler
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler && ./butler/butler -V
      - name: Check the build
        run: |
          test -f demo/index.html || { echo "demo/index.html is missing"; exit 1; }
          test -f demo/VERSION || { echo "demo/VERSION is missing"; exit 1; }
          echo "Pushing Fallrym demo $(cat demo/VERSION), $(wc -c < demo/index.html) bytes"
      - name: Push to itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler/butler push demo dossne/fallrym:html5 --userversion-file demo/VERSION
